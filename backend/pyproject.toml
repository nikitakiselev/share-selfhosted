[project]
name = "share-app"
version = "0.1.0"
description = "Self-hosted file sharing with links: resumable uploads, in-browser video, ZIP, passwords and expiry"
requires-python = ">=3.12"
dependencies = [
    "starlette>=0.47",
    "uvicorn>=0.34",
    "zipstream-ng>=1.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx2>=2.13"]

[project.scripts]
share-app = "share_app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/share_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
